[defaults]
inventory = ./inventory/netbox.yml
# Wyłączone świadomie dla izolowanej sieci zarządzania WG (częste reinstalacje routerów przez ZTP)
host_key_checking = False
retry_files_enabled = False
forks = 10
timeout = 30
stdout_callback = default
callback_result_format = yaml

[inventory]
enable_plugins = netbox.netbox.nb_inventory, yaml, ini

[persistent_connection]
connect_timeout = 30
command_timeout = 30
